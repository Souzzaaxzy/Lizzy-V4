<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Top Gear (SNES)</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header>
  <h1>TOP GEAR</h1>
  <p class="sub">Super Nintendo · 1992 · Gremlin Graphics / Kemco</p>
</header>

<main>
  <div id="game"></div>

  <section id="sem-rom" hidden>
    <p>Emulador SNES pronto — falta a ROM.</p>
    <p class="dica">
      Solte um arquivo <code>.sfc</code> (ou <code>.smc</code>) em
      <code>docs/topgear/roms/</code>. O nome pode ser qualquer um.
    </p>
    <p class="dica">Ou escolha o arquivo do seu aparelho:</p>
    <input id="arquivo" type="file" accept=".sfc,.smc,.fig,.swc,.zip">
  </section>
</main>

<footer>
  <p>Emulação via <a href="https://emulatorjs.org" target="_blank" rel="noopener">EmulatorJS</a> (snes9x, WebAssembly).</p>
</footer>

<script>
  window.TOPGEAR_DATA = 'https://cdn.emulatorjs.org/stable/data/';
  window.TOPGEAR_REPO = 'Souzzaaxzy/Lizzy-V4';
  window.TOPGEAR_DIR = 'docs/topgear/roms';
  window.TOPGEAR_ROM = './roms/topgear.sfc';
  window.TOPGEAR_ROM_CANDIDATOS = [
    './roms/topgear.sfc', './roms/topgear.smc',
    './roms/topgear2.sfc', './roms/topgear2.smc',
    './roms/TopGear.sfc', './roms/TopGear.smc',
    './roms/TopGear2.sfc', './roms/TopGear2.smc',
    './roms/game.sfc', './roms/game.smc',
    './roms/rom.sfc', './roms/rom.smc'
  ];
</script>

<script>
(function () {
  const DATA = window.TOPGEAR_DATA;
  const alvo = document.getElementById('game');
  const semRom = document.getElementById('sem-rom');
  const input = document.getElementById('arquivo');
  const SRC = DATA + 'src/';

  function configurar(romUrl) {
    window.EJS_player = '#game';
    window.EJS_core = 'snes';
    window.EJS_gameUrl = romUrl;
    window.EJS_gameName = 'Top Gear';
    window.EJS_pathtodata = DATA;
    window.EJS_startOnLoaded = true;
    window.EJS_color = '#1d4ed8';
    window.EJS_backgroundColor = '#0b0d12';
    window.EJS_language = 'pt-BR';
    window.EJS_paths = {
      'GameManager.js': SRC + 'GameManager.js',
      'compression.js': SRC + 'compression.js',
      'emulator.js': SRC + 'emulator.js',
      'gamepad.js': SRC + 'gamepad.js',
      'loader.js': DATA + 'loader.js',
      'nipplejs.js': SRC + 'nipplejs.js',
      'shaders.js': SRC + 'shaders.js',
      'socket.io.min.js': SRC + 'socket.io.min.js',
      'storage.js': SRC + 'storage.js',
      'emulator.min.css': DATA + 'emulator.min.css'
    };
    semRom.hidden = true;
    alvo.hidden = false;
    const s = document.createElement('script');
    s.src = DATA + 'loader.js';
    document.body.appendChild(s);
  }

  function aviso() {
    alvo.hidden = true;
    semRom.hidden = false;
  }

  input.addEventListener('change', () => {
    const f = input.files && input.files[0];
    if (f) configurar(URL.createObjectURL(f));
  });

  const EXT = /\.(sfc|smc|fig|swc|zip)$/i;

  async function viaApi() {
    try {
      const r = await fetch(`https://api.github.com/repos/${window.TOPGEAR_REPO}/contents/${window.TOPGEAR_DIR}`);
      if (!r.ok) return null;
      const lista = await r.json();
      const rom = Array.isArray(lista) ? lista.find((x) => EXT.test(x.name)) : null;
      return rom ? `./roms/${encodeURIComponent(rom.name)}` : null;
    } catch {
      return null;
    }
  }

  async function viaCandidatos() {
    const lista = [window.TOPGEAR_ROM, ...(window.TOPGEAR_ROM_CANDIDATOS || [])];
    for (const url of lista) {
      try {
        const r = await fetch(url, { method: 'HEAD' });
        if (r.ok) return url;
      } catch { /* tenta o próximo */ }
    }
    return null;
  }

  (async () => {
    const rom = (await viaApi()) || (await viaCandidatos());
    if (rom) configurar(rom);
    else aviso();
  })();
})();
</script>
</body>
</html>

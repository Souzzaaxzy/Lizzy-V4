<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>EmuGames</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header>
  <h1 id="titulo">EMUGAMES</h1>
  <p class="sub" id="subtitulo"></p>
</header>

<main>
  <div id="game"></div>

  <section id="lista" hidden>
    <p class="dica">Escolha um jogo:</p>
    <div id="jogos"></div>
  </section>

  <section id="sem-rom" hidden>
    <p>Nenhum jogo disponível.</p>
    <p class="dica">Adicione a ROM em <code>jogos/&lt;console&gt;/</code> e registre no <code>jogos.json</code>.</p>
  </section>

  <div id="controles">
    <button id="parar" type="button" disabled>■ PARAR</button>
    <button id="trocar" type="button" hidden>☰ JOGOS</button>
    <span id="status"></span>
  </div>
</main>

<script>
  window.EJS_DATA = 'https://cdn.emulatorjs.org/stable/data/';
  window.INATIVIDADE_MS = 3 * 60 * 1000;
</script>

<script>
(function () {
  const DATA = window.EJS_DATA;
  const SRC = DATA + 'src/';
  const LIMITE = window.INATIVIDADE_MS;

  const alvo = document.getElementById('game');
  const lista = document.getElementById('lista');
  const listaJogos = document.getElementById('jogos');
  const semRom = document.getElementById('sem-rom');
  const titulo = document.getElementById('titulo');
  const subtitulo = document.getElementById('subtitulo');
  const pararBtn = document.getElementById('parar');
  const trocarBtn = document.getElementById('trocar');
  const status = document.getElementById('status');

  let catalogo = [];
  let atual = null;
  let rodando = false;
  let ocioso = Date.now();

  const CORES = { snes: '#1d4ed8', nes: '#b91c1c', gba: '#7c3aed', gb: '#166534', genesis: '#0369a1', n64: '#b45309' };
  const NOMES = { snes: 'Super Nintendo', nes: 'Nintendo', gba: 'Game Boy Advance', gb: 'Game Boy', genesis: 'Mega Drive', n64: 'Nintendo 64' };

  function marcarAtividade() { ocioso = Date.now(); }

  function aoSair() {
    rodando = false;
    pararBtn.disabled = true;
    pararBtn.textContent = '■ PARAR';
    alvo.innerHTML = '';
  }

  function parar() {
    const emu = window.EJS_emulator;
    if (emu) {
      try { emu.pause(); } catch { /* ok */ }
      try { emu.callEvent('exit'); } catch { /* ok */ }
      try { emu.callEvent('unload'); } catch { /* ok */ }
    }
    aoSair();
  }

  window.EJS_onExit = aoSair;

  function iniciar(jogo) {
    atual = jogo;
    alvo.innerHTML = '';
    window.EJS_emulator = null;

    titulo.textContent = jogo.nome;
    subtitulo.textContent = NOMES[jogo.console] || jogo.console;
    lista.hidden = true;
    semRom.hidden = true;
    alvo.hidden = false;
    trocarBtn.hidden = false;

    window.EJS_player = '#game';
    window.EJS_core = jogo.console;
    window.EJS_gameUrl = jogo.rom;
    window.EJS_gameName = jogo.nome;
    window.EJS_pathtodata = DATA;
    window.EJS_startOnLoaded = true;
    window.EJS_language = 'pt-BR';
    window.EJS_color = CORES[jogo.console] || '#1d4ed8';
    window.EJS_backgroundColor = '#0b0d12';
    window.EJS_volume = 0.6;
    window.EJS_askBeforeExit = false;
    window.EJS_controlScheme = jogo.console;
    window.EJS_Buttons = {
      playPause: true, restart: true, mute: true, settings: true, fullscreen: true,
      saveState: false, loadState: false, screenRecord: false, gamepad: false,
      cheat: false, volume: true, saveSavFiles: false, loadSavFiles: false,
      quickSave: false, quickLoad: false, screenshot: false, cacheManager: false,
      exitEmulation: true
    };
    window.EJS_paths = {
      'GameManager.js': SRC + 'GameManager.js',
      'compression.js': SRC + 'compression.js',
      'emulator.js': SRC + 'emulator.js',
      'gamepad.js': SRC + 'gamepad.js',
      'loader.js': DATA + 'loader.js',
      'nipplejs.js': SRC + 'nipplejs.js',
      'shaders.js': SRC + 'shaders.js',
      'socket.io.min.js': SRC + 'socket.io.min.js',
      'storage.js': SRC + 'storage.js',
      'emulator.min.css': DATA + 'emulator.min.css'
    };

    rodando = true;
    pararBtn.disabled = false;
    marcarAtividade();

    const s = document.createElement('script');
    s.src = DATA + 'loader.js';
    document.body.appendChild(s);
  }

  function mostrarLista() {
    parar();
    alvo.hidden = true;
    semRom.hidden = true;
    lista.hidden = false;
    trocarBtn.hidden = catalogo.length < 2;
    titulo.textContent = "EMUGAMES";
    subtitulo.textContent = catalogo.length + ' disponível(is)';
    listaJogos.innerHTML = '';
    for (const j of catalogo) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'jogo';
      b.textContent = j.nome;
      b.addEventListener('click', () => iniciar(j));
      listaJogos.appendChild(b);
    }
    if (!catalogo.length) {
      lista.hidden = true;
      semRom.hidden = false;
    }
  }

  pararBtn.addEventListener('click', parar);
  trocarBtn.addEventListener('click', mostrarLista);

  ['pointerdown', 'keydown', 'touchstart'].forEach((ev) => addEventListener(ev, marcarAtividade, { passive: true }));

  let saiu = false;
  function aoSairDaPagina() { saiu = true; parar(); }
  function aoVoltar() {
    if (!saiu) return;
    saiu = false;
    ocioso = Date.now();
    if (!rodando && atual) iniciar(atual);
  }

  document.addEventListener('visibilitychange', () => { document.hidden ? aoSairDaPagina() : aoVoltar(); });
  addEventListener('pagehide', aoSairDaPagina);
  addEventListener('beforeunload', aoSairDaPagina);
  addEventListener('freeze', aoSairDaPagina);
  addEventListener('pageshow', aoVoltar);
  addEventListener('resume', aoVoltar);

  setInterval(() => {
    if (!rodando) return;
    if (Date.now() - ocioso < LIMITE) return;
    parar();
    status.textContent = 'desligado por inatividade (3 min)';
  }, 5000);

  (async () => {
    try {
      const r = await fetch('./jogos.json', { cache: 'no-store' });
      const d = await r.json();
      catalogo = (Array.isArray(d.jogos) ? d.jogos : []).filter((j) => j && j.id && j.rom && j.console);
    } catch {
      catalogo = [];
    }

    const id = new URLSearchParams(location.search).get('jogo');
    const escolhido = id ? catalogo.find((j) => j.id === id) : catalogo[0];

    if (escolhido) iniciar(escolhido);
    else mostrarLista();
  })();
})();
</script>
</body>
</html>

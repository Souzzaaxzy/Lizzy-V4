<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>TOP GEAR</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #0b0d12; color: #e8ecf3; font-family: system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 16px; }
  h1 { font-size: 20px; letter-spacing: 4px; font-weight: 800; }
  #stage { background: #11151c; border: 1px solid #222a36; border-radius: 8px; display: block; touch-action: none; }
  #info { font-size: 12px; color: #8b98ad; text-align: center; line-height: 1.5; }
  button {
    background: #1d4ed8; color: #fff; border: 0; border-radius: 6px;
    padding: 10px 18px; font-size: 14px; font-weight: 700; letter-spacing: 1px;
  }
  button:disabled { opacity: .5; }
  #pad { display: grid; grid-template-columns: repeat(3, 54px); gap: 6px; touch-action: none; }
  #pad div {
    background: #1a2029; border: 1px solid #2b3543; border-radius: 6px; height: 46px;
    display: flex; align-items: center; justify-content: center; font-size: 18px; user-select: none;
  }
  #pad div.on { background: #1d4ed8; }
</style>
</head>
<body>
<h1>TOP GEAR</h1>
<canvas id="stage" width="320" height="240"></canvas>
<div id="info">carregando engine…</div>
<button id="play" disabled>JOGAR</button>
<div id="pad">
  <div></div><div data-k="up">▲</div><div></div>
  <div data-k="left">◀</div><div data-k="down">▼</div><div data-k="right">▶</div>
  <div data-k="b">B</div><div data-k="a">A</div><div></div>
</div>
<script src="./app.js"></script>
</body>
</html>

# ============================================================
# TOPGEAR — bloco para o nginx do servidor
# ============================================================
#
# COLE O BLOCO ABAIXO DENTRO do `server { ... }` que atende o domínio
# aleatoryconteudos.com (o que tem `server_name aleatoryconteudos.com;`).
#
# Depois recarregue o nginx (ou reinicie o serviço pelo painel do host).

location /topgear/ {
    proxy_pass http://127.0.0.1:8099/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # Remove a CSP restritiva que bloquearia o WebAssembly.
    proxy_hide_header Content-Security-Policy;
}

# ============================================================
# TOPGEAR — EXEMPLO de como fica o `server { }` do nginx
# ============================================================
#
# NÃO use este arquivo como está — ele é só um MAPA mostrando ONDE o bloco
# do /topgear/ entra. O seu arquivo real já existe e já tem outros locations;
# você só adiciona o bloco do /topgear/ lá dentro, junto dos outros.
#
# Arquivo real (no servidor): normalmente
#   /etc/nginx/sites-available/aleatoryconteudos.com
#   /etc/nginx/conf.d/aleatoryconteudos.com.conf
#
# Regra de ouro: o `location /topgear/` precisa ficar ANTES do `}` que fecha
# o `server { }`. Se colocar depois, o nginx quebra.

server {
    listen 443 ssl;
    server_name aleatoryconteudos.com;

    # ... o que já existe no seu servidor (root, ssl_certificate, etc.) ...

    location / {
        try_files $uri $uri/ =404;
    }

    # ┌──────────────────────────────────────────────────────┐
    # │  ADICIONE ESTE BLOCO (conteúdo de nginx/topgear.conf) │
    # └──────────────────────────────────────────────────────┘
    location /topgear/ {
        proxy_pass http://127.0.0.1:8099/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_hide_header Content-Security-Policy;
    }
    # ┌──────────────────────────────────────────────────────┐
    # │  FIM do bloco a adicionar                             │
    # └──────────────────────────────────────────────────────┘
}

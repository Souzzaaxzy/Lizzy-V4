<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Top Gear</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header>
  <h1>TOP GEAR</h1>
</header>

<main>
  <div id="game"></div>

  <section id="sem-rom" hidden>
    <p>Falta a ROM.</p>
    <p class="dica">Solte um <code>.sfc</code>/<code>.smc</code> em <code>docs/topgear/roms/</code> ou escolha do aparelho:</p>
    <input id="arquivo" type="file" accept=".sfc,.smc,.fig,.swc,.zip">
  </section>

  <div id="controles">
    <button id="parar" type="button" disabled>■ PARAR</button>
    <span id="status"></span>
  </div>
</main>

<script>
  window.TOPGEAR_DATA = 'https://cdn.emulatorjs.org/stable/data/';
  window.TOPGEAR_REPO = 'Souzzaaxzy/Lizzy-V4';
  window.TOPGEAR_DIR = 'docs/topgear/roms';
  window.TOPGEAR_INATIVIDADE_MS = 3 * 60 * 1000;
  window.TOPGEAR_ROM = './roms/topgear.sfc';
  window.TOPGEAR_ROM_CANDIDATOS = [
    './roms/topgear.sfc', './roms/topgear.smc',
    './roms/topgear2.sfc', './roms/topgear2.smc',
    './roms/TopGear.sfc', './roms/TopGear.smc',
    './roms/TopGear2.sfc', './roms/TopGear2.smc',
    './roms/game.sfc', './roms/game.smc',
    './roms/rom.sfc', './roms/rom.smc'
  ];
</script>

<script>
(function () {
  const DATA = window.TOPGEAR_DATA;
  const SRC = DATA + 'src/';
  const alvo = document.getElementById('game');
  const semRom = document.getElementById('sem-rom');
  const input = document.getElementById('arquivo');
  const pararBtn = document.getElementById('parar');
  const status = document.getElementById('status');

  let rodando = false;
  let ocioso = 0;
  const LIMITE = window.TOPGEAR_INATIVIDADE_MS;

  function marcarAtividade() { ocioso = Date.now(); }

  function aoSair() {
    rodando = false;
    pararBtn.disabled = true;
    pararBtn.textContent = '■ PARAR';
    status.textContent = '';
    alvo.innerHTML = '';
    semRom.hidden = true;
  }

  function parar() {
    const emu = window.EJS_emulator;
    if (emu) {
      try { emu.pause(); } catch { /* já pausado */ }
      try { emu.callEvent('exit'); } catch { /* já saiu */ }
      try { emu.callEvent('unload'); } catch { /* sem unload */ }
    }
    aoSair();
  }

  window.EJS_onExit = aoSair;

  function iniciarEmulador(romUrl) {
    romAtual = romUrl;
    alvo.innerHTML = '';
    window.EJS_emulator = null;
    window.EJS_player = '#game';
    window.EJS_core = 'snes';
    window.EJS_gameUrl = romUrl;
    window.EJS_gameName = 'Top Gear';
    window.EJS_pathtodata = DATA;
    window.EJS_startOnLoaded = true;
    window.EJS_language = 'pt-BR';
    window.EJS_color = '#1d4ed8';
    window.EJS_backgroundColor = '#0b0d12';
    window.EJS_volume = 0.6;
    window.EJS_askBeforeExit = false;
    window.EJS_disableAutoUnload = false;
    window.EJS_controlScheme = 'snes';
    window.EJS_Buttons = {
      playPause: true,
      restart: true,
      mute: true,
      settings: true,
      fullscreen: true,
      saveState: false,
      loadState: false,
      screenRecord: false,
      gamepad: false,
      cheat: false,
      volume: true,
      saveSavFiles: false,
      loadSavFiles: false,
      quickSave: false,
      quickLoad: false,
      screenshot: false,
      cacheManager: false,
      exitEmulation: true
    };
    window.EJS_paths = {
      'GameManager.js': SRC + 'GameManager.js',
      'compression.js': SRC + 'compression.js',
      'emulator.js': SRC + 'emulator.js',
      'gamepad.js': SRC + 'gamepad.js',
      'loader.js': DATA + 'loader.js',
      'nipplejs.js': SRC + 'nipplejs.js',
      'shaders.js': SRC + 'shaders.js',
      'socket.io.min.js': SRC + 'socket.io.min.js',
      'storage.js': SRC + 'storage.js',
      'emulator.min.css': DATA + 'emulator.min.css'
    };

    semRom.hidden = true;
    alvo.hidden = false;
    rodando = true;
    pararBtn.disabled = false;
    marcarAtividade();

    const s = document.createElement('script');
    s.src = DATA + 'loader.js';
    document.body.appendChild(s);
  }

  function aviso() {
    alvo.hidden = true;
    semRom.hidden = false;
    rodando = false;
    pararBtn.disabled = true;
  }

  pararBtn.addEventListener('click', parar);
  input.addEventListener('change', () => {
    const f = input.files && input.files[0];
    if (f) iniciarEmulador(URL.createObjectURL(f));
  });

  ['pointerdown', 'keydown', 'touchstart'].forEach((ev) => {
    addEventListener(ev, marcarAtividade, { passive: true });
  });

  /*
    Fechar o webview do WhatsApp nem sempre dispara visibilitychange/pagehide
    (o navegador interno pode manter a pagina viva). Por isso:
    - visibilitychange/pagehide/freeze param o emulador na hora;
    - ao VOLTAR (pageshow / visibilitychange visivel) a pagina REINICIA o
      emulador sozinha, sem precisar recarregar na mao.
  */
  let saiuDaPagina = false;
  let romAtual = null;

  function aoSairDaPagina() {
    saiuDaPagina = true;
    parar();
  }

  function aoVoltarParaPagina() {
    if (!saiuDaPagina) return;
    saiuDaPagina = false;
    ocioso = Date.now();
    if (!rodando && romAtual) {
      window.EJS_emulator = null;
      iniciarEmulador(romAtual);
    }
  }

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) aoSairDaPagina();
    else aoVoltarParaPagina();
  });
  addEventListener('pagehide', aoSairDaPagina);
  addEventListener('beforeunload', aoSairDaPagina);
  addEventListener('freeze', aoSairDaPagina);
  addEventListener('pageshow', aoVoltarParaPagina);
  addEventListener('resume', aoVoltarParaPagina);

  setInterval(() => {
    if (!rodando) return;
    if (Date.now() - ocioso < LIMITE) return;
    parar();
    status.textContent = 'desligado por inatividade (3 min)';
  }, 5000);

  const EXT = /\.(sfc|smc|fig|swc|zip)$/i;

  async function viaApi() {
    try {
      const r = await fetch(`https://api.github.com/repos/${window.TOPGEAR_REPO}/contents/${window.TOPGEAR_DIR}`);
      if (!r.ok) return null;
      const lista = await r.json();
      const rom = Array.isArray(lista) ? lista.find((x) => EXT.test(x.name)) : null;
      return rom ? `./roms/${encodeURIComponent(rom.name)}` : null;
    } catch {
      return null;
    }
  }

  async function viaCandidatos() {
    for (const url of [window.TOPGEAR_ROM, ...(window.TOPGEAR_ROM_CANDIDATOS || [])]) {
      try {
        const r = await fetch(url, { method: 'HEAD' });
        if (r.ok) return url;
      } catch { /* tenta o próximo */ }
    }
    return null;
  }

  (async () => {
    const rom = (await viaApi()) || (await viaCandidatos());
    if (rom) iniciarEmulador(rom);
    else aviso();
  })();
})();
</script>
</body>
</html>
